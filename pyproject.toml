[project]
name = "mdread"
version = "0.1.0"
description = "A minimal keyboard-driven Markdown reader for Linux"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "PyGObject",
    "Markdown",
    "Pygments",
]

[project.scripts]
mdread = "mdread.main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
"mdread" = ["*.webp"]
